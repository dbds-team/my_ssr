name: Build and Release

on:
  push:
    tags:
      - 'v*' # 只有推送带v的tag时才触发编译和发布
  workflow_dispatch: # 允许手动触发

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60 # 设置超时避免卡住
    
    env:
      NDK_VERSION: android-ndk-r12b
      SDK_TOOLS: 4333796
      SCALA_VERSION: scala-2.11.8
      
    steps:
    - name: 📥 Checkout代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 获取完整历史用于生成changelog
        
    - name: 📋 获取版本信息
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT
        echo "📌 构建版本: $VERSION"
        
    - name: ☕ 设置JDK 1.8
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '8'
        
    - name: 🔧 恢复Android缓存
      uses: actions/cache@v4
      with:
        path: ~/.android-cache
        key: ${{ runner.os }}-android-${{ env.NDK_VERSION }}-${{ env.SDK_TOOLS }}-${{ env.SCALA_VERSION }}
        restore-keys: |
          ${{ runner.os }}-android-${{ env.NDK_VERSION }}-${{ env.SDK_TOOLS }}
          
    - name: 🔧 恢复SBT ivy缓存
      uses: actions/cache@v4
      with:
        path: ~/.ivy2/cache
        key: ${{ runner.os }}-sbt-ivy-cache-${{ hashFiles('**/build.sbt') }}
        restore-keys: |
          ${{ runner.os }}-sbt-ivy-cache-
          
    - name: 🔧 恢复SBT缓存
      uses: actions/cache@v4
      with:
        path: ~/.sbt
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
        restore-keys: |
          ${{ runner.os }}-sbt-
          
    - name: 🏗️ 安装Scala
      run: |
        echo "📦 安装Scala ${{ env.SCALA_VERSION }}..."
        mkdir -p ~/.android-cache
        if [ ! -f ~/.android-cache/scala-2.11.8.deb ]; then
          echo "⬇️ 下载Scala包..."
          wget -O ~/.android-cache/scala-2.11.8.deb https://www.scala-lang.org/files/archive/scala-2.11.8.deb
        else
          echo "✅ 使用缓存的Scala包"
        fi
        sudo dpkg -i ~/.android-cache/scala-2.11.8.deb
        echo "✅ Scala安装完成"
        
    - name: 🏗️ 安装SBT
      run: |
        echo "📦 安装SBT..."
        echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
        echo "deb https://repo.scala-sbt.org/scalasbt/debian /" | sudo tee -a /etc/apt/sources.list.d/sbt.list
        curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo apt-key add
        sudo apt-get update -qq
        sudo apt-get install -y sbt
        echo "✅ SBT安装完成"
        
    - name: 🏗️ 安装依赖包
      run: |
        echo "📦 安装构建依赖..."
        sudo apt-get --quiet install --yes wget tar unzip gcc-multilib g++-multilib libstdc++6 libgcc1 zlib1g libncurses5
        echo "✅ 依赖安装完成"
        
    - name: 🔐 设置签名密钥
      if: ${{ env.KEY_JKS != '' }}
      env:
        KEY_JKS: ${{ secrets.KEY_JKS }}
        ALIAS: ${{ secrets.ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      run: |
        echo "🔐 配置APK签名..."
        # 解码证书文件
        echo "$KEY_JKS" | base64 --decode > release-key.jks
        echo "✅ 签名密钥配置完成"
        
        # 创建签名配置文件
        echo "storeFile=../release-key.jks" > local.properties
        echo "storePassword=$ANDROID_STORE_PASSWORD" >> local.properties
        echo "keyAlias=$ALIAS" >> local.properties
        echo "keyPassword=$ANDROID_KEY_PASSWORD" >> local.properties
        echo "✅ 签名配置文件创建完成"
        
    - name: 🔧 初始化Application.mk (32位版本)
      run: |
        echo "📝 创建Application.mk配置 (32位)..."
        echo -e "APP_ABI      			:= armeabi-v7a x86\nAPP_PLATFORM 			:= android-16\nAPP_STL      			:= stlport_static\nNDK_TOOLCHAIN_VERSION 	:= clang\n" > './src/main/jni/Application.mk'
        echo "✅ Application.mk创建完成 (32位)"
        cat './src/main/jni/Application.mk'
        
    - name: 🏗️ 构建32位APK
      run: |
        echo "🚀 开始构建32位Release APK..."
        echo "📋 构建信息:"
        echo "  版本: ${{ steps.version.outputs.version }}"
        echo "  项目: shadowsocksr-v2ray"
        echo "  架构: 32位 (armeabi-v7a, x86)"
        echo "  目标: release"
        
        # 设置构建环境
        chmod +x ./travis-ci/setup.sh
        ./travis-ci/setup.sh
        
        echo "✅ 32位APK构建完成"
        
    - name: 📁 检查32位构建结果并重命名
      id: rename32
      run: |
        echo "📋 32位构建输出目录内容:"
        ls -la ./target/android/output/ || echo "输出目录不存在"
        
        echo "📝 重命名32位APK文件..."
        cd ./target/android/output/
        
        # 查找release apk文件
        if [ -f "shadowsocksr-v2ray-release.apk" ]; then
          OLD_NAME="shadowsocksr-v2ray-release.apk"
        elif [ -f "app-release.apk" ]; then
          OLD_NAME="app-release.apk"
        else
          echo "❌ 未找到release APK文件"
          ls -la
          exit 1
        fi
        
        # 新文件名: 项目名+版本号+架构+.apk
        NEW_NAME="shadowsocksr-v2ray-${{ steps.version.outputs.version }}-arm32.apk"
        
        mv "$OLD_NAME" "$NEW_NAME"
        echo "✅ 32位APK文件重命名: $OLD_NAME -> $NEW_NAME"
        echo "apk32_name=$NEW_NAME" >> $GITHUB_OUTPUT
        echo "apk32_path=$(pwd)/$NEW_NAME" >> $GITHUB_OUTPUT
        
        # 显示最终文件信息
        ls -lh "$NEW_NAME"
        
        # 将32位APK移到临时目录
        mkdir -p $HOME/apk-builds
        cp "$NEW_NAME" $HOME/apk-builds/
        
        # 清理target目录准备下一次构建
        cd ../../../
        rm -rf ./target
        
    - name: 🔧 初始化Application.mk (64位版本)
      run: |
        echo "📝 创建Application.mk配置 (64位)..."
        echo -e "APP_ABI      			:= arm64-v8a x86_64\nAPP_PLATFORM 			:= android-21\nAPP_STL      			:= c++_static\nNDK_TOOLCHAIN_VERSION 	:= clang\n" > './src/main/jni/Application.mk'
        echo "✅ Application.mk创建完成 (64位)"
        cat './src/main/jni/Application.mk'
        
    - name: 🏗️ 构建64位APK
      run: |
        echo "🚀 开始构建64位Release APK..."
        echo "📋 构建信息:"
        echo "  版本: ${{ steps.version.outputs.version }}"
        echo "  项目: shadowsocksr-v2ray"
        echo "  架构: 64位 (arm64-v8a, x86_64)"
        echo "  目标: release"
        
        # 复制所需的库文件到正确的ABI目录
        echo "📋 准备库文件..."
        mkdir -p ./src/main/libs/arm64-v8a
        mkdir -p ./src/main/libs/x86_64
        
        # 保留之前编译的32位库，但也复制到64位目录作为临时方案
        # 注意：这是临时解决方案，后续需要编译真正的64位libgojni.so
        if [ -f ./src/main/libs/armeabi-v7a/libgojni.so ]; then
          cp ./src/main/libs/armeabi-v7a/libgojni.so ./src/main/libs/arm64-v8a/
          echo "✅ 复制libgojni.so到arm64-v8a"
        fi
        if [ -f ./src/main/libs/x86/libgojni.so ]; then
          cp ./src/main/libs/x86/libgojni.so ./src/main/libs/x86_64/
          echo "✅ 复制libgojni.so到x86_64"
        fi
        
        # 设置构建环境
        ./travis-ci/setup.sh
        
        echo "✅ 64位APK构建完成"
        
    - name: 📁 检查64位构建结果并重命名
      id: rename64
      run: |
        echo "📋 64位构建输出目录内容:"
        ls -la ./target/android/output/ || echo "输出目录不存在"
        
        echo "📝 重命名64位APK文件..."
        cd ./target/android/output/
        
        # 查找release apk文件
        if [ -f "shadowsocksr-v2ray-release.apk" ]; then
          OLD_NAME="shadowsocksr-v2ray-release.apk"
        elif [ -f "app-release.apk" ]; then
          OLD_NAME="app-release.apk"
        else
          echo "❌ 未找到release APK文件"
          ls -la
          exit 1
        fi
        
        # 新文件名: 项目名+版本号+架构+.apk
        NEW_NAME="shadowsocksr-v2ray-${{ steps.version.outputs.version }}-arm64.apk"
        
        mv "$OLD_NAME" "$NEW_NAME"
        echo "✅ 64位APK文件重命名: $OLD_NAME -> $NEW_NAME"
        echo "apk64_name=$NEW_NAME" >> $GITHUB_OUTPUT
        echo "apk64_path=$(pwd)/$NEW_NAME" >> $GITHUB_OUTPUT
        
        # 显示最终文件信息
        ls -lh "$NEW_NAME"
        
        # 将64位APK复制到临时目录
        cp "$NEW_NAME" $HOME/apk-builds/
        
        # 准备所有APK文件路径
        cd $HOME/apk-builds/
        echo "apk_builds_dir=$HOME/apk-builds" >> $GITHUB_OUTPUT
        ls -lh *.apk
        
    - name: 📦 上传APK到Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: shadowsocksr-v2ray-${{ steps.version.outputs.version }}
        path: ${{ env.HOME }}/apk-builds/*.apk
        retention-days: 30
        
    - name: 📊 生成Release说明
      id: changelog
      run: |
        echo "📊 生成Release说明..."
        
        # 获取上一个tag
        PREV_TAG=$(git tag --sort=-version:refname | grep "^v" | head -2 | tail -1)
        if [ -z "$PREV_TAG" ]; then
          PREV_TAG=$(git rev-list --max-parents=0 HEAD)
        fi
        
        echo "🔍 对比范围: $PREV_TAG..${{ steps.version.outputs.version }}"
        
        # 生成changelog
        cat > release_notes.md << EOF
        ## 🚀 ShadowsocksR V2Ray ${{ steps.version.outputs.version }}
        
        ### 📋 版本信息
        - **版本号**: ${{ steps.version.outputs.version }}
        - **构建时间**: $(date '+%Y-%m-%d %H:%M:%S UTC')
        - **构建分支**: ${GITHUB_REF#refs/tags/}
        
        ### 📦 下载信息
        - **32位APK**: ${{ steps.rename32.outputs.apk32_name }} ($(ls -lh $HOME/apk-builds/${{ steps.rename32.outputs.apk32_name }} | awk '{print $5}'))
        - **64位APK**: ${{ steps.rename64.outputs.apk64_name }} ($(ls -lh $HOME/apk-builds/${{ steps.rename64.outputs.apk64_name }} | awk '{print $5}'))
        
        ### 📝 更新内容
        EOF
        
        # 添加提交历史
        git log --pretty=format:"- %s (%h)" $PREV_TAG..${{ steps.version.outputs.version }} >> release_notes.md
        
        echo "✅ Release说明生成完成"
        cat release_notes.md
        
    - name: 🎉 创建GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ShadowsocksR V2Ray ${{ steps.version.outputs.version }}
        body_path: release_notes.md
        files: |
          ${{ steps.rename64.outputs.apk_builds_dir }}/${{ steps.rename32.outputs.apk32_name }}
          ${{ steps.rename64.outputs.apk_builds_dir }}/${{ steps.rename64.outputs.apk64_name }}
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'rc') }}
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 🎊 构建完成
      run: |
        echo "🎊 构建和发布完成!"
        echo "📦 32位APK: ${{ steps.rename32.outputs.apk32_name }}"
        echo "📦 64位APK: ${{ steps.rename64.outputs.apk64_name }}"
        echo "🔗 Release链接: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}" 